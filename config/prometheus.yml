global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "observability-platform"
    environment: "local"

rule_files:
  - "rules/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "observability-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "observability-demo-api"
          environment: "local"
